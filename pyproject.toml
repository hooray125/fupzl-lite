[project]
name = "litefupzl"
version = "0.1.0"
description = "Lightweight browser oneshot and probe runner"
requires-python = ">=3.13"
dependencies = [
    "playwright==1.62.0",
    "patchright==1.62.1",
    "camoufox==0.4.11",
    "pyvirtualdisplay==3.0",
    "curl_cffi==0.16.0",
    "beautifulsoup4==4.15.0",
    "pyyaml==6.0.3",
    "pydantic==2.13.4",
    "loguru==0.7.3",
    "click==8.4.2",
    "pynacl==1.6.2",
]

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pyyaml==6.0.3",
]

[project.scripts]
litefupzl = "litefupzl.oneshot.orchestrator:run_oneshot_sync"

[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
