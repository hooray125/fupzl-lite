name: litefupzl probes

on:
  workflow_dispatch:
    inputs:
      probe:
        description: Probe to run
        required: true
        default: browser
        type: choice
        options:
          - browser
          - auth
          - cf
          - driver-matrix
          - watchdog-selftest
      upload_artifacts:
        description: Upload public redacted artifacts for this manual run
        required: false
        default: "false"

jobs:
  probe:
    if: inputs.probe != 'driver-matrix' && inputs.probe != 'watchdog-selftest'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
      actions: write
    env:
      # Non-sensitive config prefers Variables (vars), then falls back to Secrets, then defaults.
      LITEFUPZL_SITE: ${{ vars.LITEFUPZL_SITE || vars.FUCKPZL_ONESHOT_SITE || secrets.LITEFUPZL_SITE || secrets.FUCKPZL_ONESHOT_SITE || 'linux.do' }}
      LITEFUPZL_DURATION_MINUTES: "2"
      LITEFUPZL_HEADLESS: ${{ vars.LITEFUPZL_HEADLESS || vars.FUCKPZL_ONESHOT_HEADLESS || secrets.LITEFUPZL_HEADLESS || secrets.FUCKPZL_ONESHOT_HEADLESS || 'false' }}
      LITEFUPZL_OUTPUT_DIR: ${{ vars.LITEFUPZL_OUTPUT_DIR || vars.FUCKPZL_ONESHOT_OUTPUT_DIR || secrets.LITEFUPZL_OUTPUT_DIR || secrets.FUCKPZL_ONESHOT_OUTPUT_DIR || 'output/litefupzl' }}
      LITEFUPZL_BROWSER: ${{ vars.LITEFUPZL_BROWSER || vars.FUCKPZL_ONESHOT_BROWSER || secrets.LITEFUPZL_BROWSER || secrets.FUCKPZL_ONESHOT_BROWSER || 'camoufox' }}
      LITEFUPZL_PROXY_SERVER: ${{ vars.LITEFUPZL_PROXY_SERVER || vars.FUCKPZL_ONESHOT_PROXY_SERVER || secrets.LITEFUPZL_PROXY_SERVER || secrets.FUCKPZL_ONESHOT_PROXY_SERVER || 'http://127.0.0.1:1080' }}
      LITEFUPZL_VIRTUAL_DISPLAY: ${{ vars.LITEFUPZL_VIRTUAL_DISPLAY || vars.FUCKPZL_ONESHOT_VIRTUAL_DISPLAY || secrets.LITEFUPZL_VIRTUAL_DISPLAY || secrets.FUCKPZL_ONESHOT_VIRTUAL_DISPLAY || 'true' }}
      LITEFUPZL_CF_PROBE_URL: ${{ vars.LITEFUPZL_CF_PROBE_URL || vars.FUCKPZL_CF_PROBE_URL || secrets.LITEFUPZL_CF_PROBE_URL || secrets.FUCKPZL_CF_PROBE_URL || 'https://linux.do/challenge' }}
      LITEFUPZL_CF_PROBE_TIMEOUT_SECONDS: ${{ vars.LITEFUPZL_CF_PROBE_TIMEOUT_SECONDS || vars.FUCKPZL_CF_PROBE_TIMEOUT_SECONDS || secrets.LITEFUPZL_CF_PROBE_TIMEOUT_SECONDS || secrets.FUCKPZL_CF_PROBE_TIMEOUT_SECONDS || '120' }}
      LITEFUPZL_COOKIE_REFRESH_ENABLED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install official Cloudflare WARP
        run: |
          sudo apt-get update
          sudo apt-get install -y curl gpg lsb-release
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update
          sudo apt-get install -y cloudflare-warp

      - name: Connect WARP
        run: |
          sudo pkill warp-svc || true
          sudo nohup warp-svc > warp-svc.log 2>&1 &
          sleep 5
          warp-cli --accept-tos registration new || warp-cli registration new || true
          warp-cli --accept-tos connect || warp-cli connect || true
          sleep 15
          warp-cli --accept-tos status || warp-cli status || true
          curl -fsSL https://www.cloudflare.com/cdn-cgi/trace | tee warp-trace.txt
          grep -q 'warp=on' warp-trace.txt

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.lock
          python -m pip install --no-build-isolation --no-deps -e .
          sudo apt-get install -y xvfb
          case "${LITEFUPZL_BROWSER:-camoufox}" in
            patchright-chromium)
              python -m patchright install --with-deps chromium
              ;;
            camoufox)
              python -m playwright install-deps firefox
              GITHUB_TOKEN="${{ github.token }}" python apps/litefupzl/fetch_camoufox.py
              ;;
            firefox)
              python -m playwright install --with-deps firefox
              ;;
            *)
              python -m playwright install --with-deps chromium
              ;;
          esac

      - name: Start local HTTP proxy over WARP
        run: |
          nohup python -m proxy --hostname 127.0.0.1 --port 1080 > local-proxy.log 2>&1 &
          sleep 5
          curl -fsSL -x http://127.0.0.1:1080 https://www.cloudflare.com/cdn-cgi/trace | tee warp-proxy-trace.txt
          grep -q 'warp=on' warp-proxy-trace.txt

      - name: Run authenticated probe
        if: inputs.probe == 'browser' || inputs.probe == 'auth'
        env:
          LITEFUPZL_COOKIES_JSON: ${{ secrets.LITEFUPZL_COOKIES_JSON || secrets.FUCKPZL_ONESHOT_COOKIES_JSON }}
        run: |
          case "${{ inputs.probe }}" in
            browser) target="apps/litefupzl/probe_browser.py" ;;
            auth) target="apps/litefupzl/auth_probe.py" ;;
            *) echo "Unknown probe: ${{ inputs.probe }}" >&2; exit 1 ;;
          esac

          if [ "${LITEFUPZL_HEADLESS:-true}" = "false" ] && [ "${LITEFUPZL_VIRTUAL_DISPLAY:-true}" != "true" ]; then
            xvfb-run -a python "$target"
          else
            python "$target"
          fi

      - name: Run unauthenticated CF probe
        if: inputs.probe == 'cf'
        run: |
          if [ "${LITEFUPZL_HEADLESS:-true}" = "false" ] && [ "${LITEFUPZL_VIRTUAL_DISPLAY:-true}" != "true" ]; then
            xvfb-run -a python apps/litefupzl/cf_probe.py
          else
            python apps/litefupzl/cf_probe.py
          fi

      - name: Upload redacted artifacts
        if: always() && github.event_name == 'workflow_dispatch' && inputs.upload_artifacts == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: litefupzl-probe-public-artifacts
          path: |
            ${{ env.LITEFUPZL_OUTPUT_DIR }}/
            warp-trace.txt
            warp-proxy-trace.txt
            warp-svc.log
            local-proxy.log

      - name: Cleanup old workflow runs
        if: always()
        env:
          ACTIONS_CLEANUP_TOKEN: ${{ github.token }}
          ACTIONS_RUNS_KEEP: ${{ vars.LITEFUPZL_ACTIONS_RUNS_KEEP || vars.FUCKPZL_ACTIONS_RUNS_KEEP || secrets.LITEFUPZL_ACTIONS_RUNS_KEEP || secrets.FUCKPZL_ACTIONS_RUNS_KEEP || '15' }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          repo = os.environ.get("GITHUB_REPOSITORY")
          token = os.environ.get("ACTIONS_CLEANUP_TOKEN")
          current_run_id = str(os.environ.get("GITHUB_RUN_ID") or "")
          try:
              keep = max(1, int(os.environ.get("ACTIONS_RUNS_KEEP") or "15"))
          except ValueError:
              keep = 15

          if not repo or not token:
              print("cleanup_skipped=missing_repo_or_token")
              raise SystemExit(0)

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "User-Agent": "litefupzl-actions-run-cleanup",
          }

          def request(method: str, url: str):
              req = urllib.request.Request(url, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=30) as resp:
                  payload = resp.read()
                  return json.loads(payload) if payload else None

          all_runs = []
          page = 1
          while True:
              url = "https://api.github.com/repos/{}/actions/runs?{}".format(
                  repo,
                  urllib.parse.urlencode({"per_page": 100, "page": page}),
              )
              try:
                  data = request("GET", url)
              except urllib.error.HTTPError as exc:
                  print(f"cleanup_fetch_failed=status_{exc.code}")
                  raise SystemExit(0)

              runs = (data or {}).get("workflow_runs", [])
              if not runs:
                  break
              all_runs.extend(runs)
              if len(runs) < 100:
                  break
              page += 1

          deleted = 0
          skipped = 0
          for index, run in enumerate(all_runs):
              if index < keep:
                  continue
              run_id = str(run.get("id") or "")
              if not run_id or run_id == current_run_id or run.get("status") != "completed":
                  skipped += 1
                  continue
              try:
                  request("DELETE", f"https://api.github.com/repos/{repo}/actions/runs/{run_id}")
                  deleted += 1
                  print(f"deleted_run={run_id}")
              except urllib.error.HTTPError as exc:
                  skipped += 1
                  print(f"delete_failed={run_id} status={exc.code}")

          print(f"cleanup_runs_seen={len(all_runs)} keep={keep} deleted={deleted} skipped={skipped}")
          PY

  driver-matrix:
    if: inputs.probe == 'driver-matrix'
    name: driver-${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - label: ubuntu24-camoufox-r1
            os: ubuntu-24.04
            browser: camoufox
          - label: ubuntu24-camoufox-r2
            os: ubuntu-24.04
            browser: camoufox
          - label: ubuntu24-camoufox-r3
            os: ubuntu-24.04
            browser: camoufox
          - label: ubuntu22-camoufox-r1
            os: ubuntu-22.04
            browser: camoufox
          - label: ubuntu22-camoufox-r2
            os: ubuntu-22.04
            browser: camoufox
          - label: ubuntu22-camoufox-r3
            os: ubuntu-22.04
            browser: camoufox
          - label: ubuntu24-firefox-r1
            os: ubuntu-24.04
            browser: firefox
          - label: ubuntu24-firefox-r2
            os: ubuntu-24.04
            browser: firefox
          - label: ubuntu24-patchright-r1
            os: ubuntu-24.04
            browser: patchright-chromium
          - label: ubuntu24-patchright-r2
            os: ubuntu-24.04
            browser: patchright-chromium
    env:
      LITEFUPZL_HEADLESS: "false"
      LITEFUPZL_OUTPUT_DIR: output/driver-matrix
      LITEFUPZL_BROWSER: ${{ matrix.browser }}
      LITEFUPZL_PROXY_SERVER: http://127.0.0.1:1080
      LITEFUPZL_VIRTUAL_DISPLAY: "true"
      LITEFUPZL_CF_PROBE_URL: https://linux.do/challenge
      LITEFUPZL_CF_PROBE_TIMEOUT_SECONDS: "90"
      LITEFUPZL_COOKIE_REFRESH_ENABLED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Record runtime versions
        run: |
          {
            echo "matrix_label=${{ matrix.label }}"
            echo "runner_os=${{ matrix.os }}"
            echo "browser_backend=${{ matrix.browser }}"
            echo "runner_image_os=${ImageOS:-unknown}"
            echo "runner_image_version=${ImageVersion:-unknown}"
          } | tee driver-matrix-runtime.txt

      - name: Install official Cloudflare WARP
        run: |
          sudo apt-get update
          sudo apt-get install -y curl gpg lsb-release
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update
          sudo apt-get install -y cloudflare-warp

      - name: Connect WARP
        run: |
          sudo pkill warp-svc || true
          sudo nohup warp-svc > warp-svc.log 2>&1 &
          sleep 5
          warp-cli --accept-tos registration new || warp-cli registration new || true
          warp-cli --accept-tos connect || warp-cli connect || true
          sleep 15
          warp-cli --accept-tos status || warp-cli status || true
          curl -fsSL https://www.cloudflare.com/cdn-cgi/trace | tee warp-trace.txt
          grep -q 'warp=on' warp-trace.txt

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.lock
          python -m pip install --no-build-isolation --no-deps -e .
          sudo apt-get install -y xvfb
          case "${LITEFUPZL_BROWSER}" in
            patchright-chromium)
              python -m patchright install --with-deps chromium
              ;;
            camoufox)
              python -m playwright install-deps firefox
              GITHUB_TOKEN="${{ github.token }}" python apps/litefupzl/fetch_camoufox.py
              ;;
            firefox)
              python -m playwright install --with-deps firefox
              ;;
            *)
              echo "unsupported matrix browser: ${LITEFUPZL_BROWSER}" >&2
              exit 1
              ;;
          esac
          python - <<'PY' | tee -a driver-matrix-runtime.txt
          import importlib.metadata
          import json
          import os
          import pathlib
          import subprocess

          versions = {
              name: importlib.metadata.version(name)
              for name in ("camoufox", "playwright", "patchright", "browserforge")
          }
          driver_node = pathlib.Path(importlib.metadata.distribution("playwright").locate_file("playwright/driver/node"))
          if driver_node.exists():
              versions["playwright_driver_node"] = subprocess.check_output(
                  [str(driver_node), "--version"], text=True
              ).strip()
          versions["browser_backend"] = os.environ["LITEFUPZL_BROWSER"]
          print("runtime_versions=" + json.dumps(versions, sort_keys=True))
          PY

      - name: Start local HTTP proxy over WARP
        run: |
          nohup python -m proxy --hostname 127.0.0.1 --port 1080 > local-proxy.log 2>&1 &
          sleep 5
          curl -fsSL -x http://127.0.0.1:1080 https://www.cloudflare.com/cdn-cgi/trace | tee warp-proxy-trace.txt
          grep -q 'warp=on' warp-proxy-trace.txt

      - name: Run unauthenticated frame stress probe
        id: stress
        run: |
          set +e
          timeout --signal=TERM --kill-after=15s 210s \
            python apps/litefupzl/cf_probe.py 2>&1 | tee driver-stress.log
          probe_rc=${PIPESTATUS[0]}
          set -e

          if grep -Eiq 'Assertion error|FrameManager\.frameAttached|FFPage\._onFrameAttached|pipe closed by peer|Connection closed while reading from the driver|Target page, context or browser has been closed' driver-stress.log; then
            echo "driver_crash_detected=true" | tee -a driver-matrix-runtime.txt
            echo "probe_exit_code=${probe_rc}" | tee -a driver-matrix-runtime.txt
            exit 86
          fi

          echo "driver_crash_detected=false" | tee -a driver-matrix-runtime.txt
          echo "probe_exit_code=${probe_rc}" | tee -a driver-matrix-runtime.txt

      - name: Upload matrix evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: driver-matrix-${{ matrix.label }}
          path: |
            driver-matrix-runtime.txt
            driver-stress.log
            output/driver-matrix/
            warp-trace.txt
            warp-proxy-trace.txt
          if-no-files-found: warn

  watchdog-selftest:
    if: inputs.probe == 'watchdog-selftest'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Verify hard process-tree termination
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import sys
          import tempfile
          import time

          from apps.litefupzl.watchdog import run_watchdog

          results = []
          with tempfile.TemporaryDirectory(prefix="watchdog-selftest-") as temp:
              root = pathlib.Path(temp)
              pid_file = root / "grandchild.pid"
              child_source = (
                  "import pathlib,subprocess,sys,time;"
                  f"p=subprocess.Popen([sys.executable,'-c','import time;time.sleep(300)']);"
                  f"pathlib.Path({str(pid_file)!r}).write_text(str(p.pid));"
                  "print('2026-08-21T00:00:00Z | INFO | slot-001 login-prewarm started',flush=True);"
                  "time.sleep(300)"
              )
              preauth_dir = root / "preauth"
              code = run_watchdog(
                  command=[sys.executable, "-c", child_source],
                  output_dir=preauth_dir,
                  startup_seconds=2,
                  pre_login_seconds=1,
                  cookie_sync_seconds=1,
                  driver_cleanup_seconds=1,
                  post_login_grace_seconds=1,
                  termination_grace_seconds=1,
                  poll_seconds=0.05,
              )
              state = json.loads((preauth_dir / "watchdog_state.json").read_text())
              assert code == 124
              assert state["timeout_code"] == "BROWSER_DRIVER_HANG_PRE_AUTH"
              grandchild_pid = int(pid_file.read_text())
              time.sleep(0.5)
              proc_state = pathlib.Path(f"/proc/{grandchild_pid}/stat")
              if proc_state.exists():
                  fields = proc_state.read_text().split()
                  assert len(fields) > 2 and fields[2] == "Z", fields
              results.append({"case": "preauth_process_tree", "exit_code": code, "state": state})

              success_dir = root / "success"
              success_source = (
                  "print('2026-08-21T00:00:00Z | INFO | slot-001 login-check ok',flush=True);"
                  "print('2026-08-21T00:00:01Z | INFO | slot-001 cookie-refresh unchanged',flush=True)"
              )
              code = run_watchdog(
                  command=[sys.executable, "-c", success_source],
                  output_dir=success_dir,
                  startup_seconds=2,
                  pre_login_seconds=2,
                  cookie_sync_seconds=2,
                  driver_cleanup_seconds=1,
                  post_login_grace_seconds=2,
                  termination_grace_seconds=1,
                  poll_seconds=0.05,
              )
              state = json.loads((success_dir / "watchdog_state.json").read_text())
              assert code == 0
              assert state["phase"] == "authenticated_synced"
              results.append({"case": "normal_exit", "exit_code": code, "state": state})

          pathlib.Path("watchdog-selftest.json").write_text(json.dumps(results, indent=2))
          print("watchdog_selftest=success cases=2")
          PY

      - name: Upload watchdog evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: watchdog-selftest
          path: watchdog-selftest.json
          if-no-files-found: error
