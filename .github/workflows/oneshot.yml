name: litefupzl oneshot

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: Optional per-slot runtime override for manual smoke tests
        required: false
        default: ""
      browser_backend:
        description: Browser backend override for manual compatibility tests
        required: false
        default: configured
        type: choice
        options:
          - configured
          - camoufox
          - firefox
          - patchright-chromium
      runner_os:
        description: Runner image override for manual compatibility tests
        required: false
        default: ubuntu-24.04
        type: choice
        options:
          - ubuntu-latest
          - ubuntu-24.04
          - ubuntu-22.04
      cookie_refresh_enabled:
        description: Write back refreshed production cookie for this manual run (set false to disable)
        required: false
        default: "true"
      cookie_refresh_probe:
        description: Run a dedicated redacted GitHub secret persistence probe
        required: false
        default: "false"
      upload_artifacts:
        description: Upload public redacted artifacts for this manual run
        required: false
        default: "false"
  schedule:
    # GitHub cron is always UTC. These map to 09:30 and 15:30 UTC+8.
    - cron: "30 1 * * *"
    - cron: "30 7 * * *"

concurrency:
  group: litefupzl-oneshot
  cancel-in-progress: false

jobs:
  oneshot:
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner_os || 'ubuntu-24.04' }}
    timeout-minutes: 240
    permissions:
      contents: read
      actions: write
    env:
      # Non-sensitive config prefers Variables (vars), then falls back to Secrets, then defaults.
      LITEFUPZL_SITE: ${{ vars.LITEFUPZL_SITE || vars.FUCKPZL_ONESHOT_SITE || secrets.LITEFUPZL_SITE || secrets.FUCKPZL_ONESHOT_SITE || 'linux.do' }}
      LITEFUPZL_DURATION_MINUTES: ${{ github.event_name == 'workflow_dispatch' && inputs.duration_minutes || vars.LITEFUPZL_DURATION_MINUTES || vars.FUCKPZL_ONESHOT_DURATION_MINUTES || secrets.LITEFUPZL_DURATION_MINUTES || secrets.FUCKPZL_ONESHOT_DURATION_MINUTES || '40' }}
      LITEFUPZL_MONTHLY_TOPIC_TARGET: ${{ vars.LITEFUPZL_MONTHLY_TOPIC_TARGET || vars.FUCKPZL_ONESHOT_MONTHLY_TOPIC_TARGET || secrets.LITEFUPZL_MONTHLY_TOPIC_TARGET || secrets.FUCKPZL_ONESHOT_MONTHLY_TOPIC_TARGET || '500' }}
      LITEFUPZL_SCHEDULE_RUNS_PER_DAY: ${{ vars.LITEFUPZL_SCHEDULE_RUNS_PER_DAY || vars.FUCKPZL_ONESHOT_SCHEDULE_RUNS_PER_DAY || secrets.LITEFUPZL_SCHEDULE_RUNS_PER_DAY || secrets.FUCKPZL_ONESHOT_SCHEDULE_RUNS_PER_DAY || '2' }}
      LITEFUPZL_TOPIC_PREFETCH_PAGES: ${{ vars.LITEFUPZL_TOPIC_PREFETCH_PAGES || vars.FUCKPZL_ONESHOT_TOPIC_PREFETCH_PAGES || secrets.LITEFUPZL_TOPIC_PREFETCH_PAGES || secrets.FUCKPZL_ONESHOT_TOPIC_PREFETCH_PAGES || '7' }}
      LITEFUPZL_TOPIC_PREFETCH_MAX_PAGES: ${{ vars.LITEFUPZL_TOPIC_PREFETCH_MAX_PAGES || vars.FUCKPZL_ONESHOT_TOPIC_PREFETCH_MAX_PAGES || secrets.LITEFUPZL_TOPIC_PREFETCH_MAX_PAGES || secrets.FUCKPZL_ONESHOT_TOPIC_PREFETCH_MAX_PAGES || '10' }}
      LITEFUPZL_HEADLESS: ${{ vars.LITEFUPZL_HEADLESS || vars.FUCKPZL_ONESHOT_HEADLESS || secrets.LITEFUPZL_HEADLESS || secrets.FUCKPZL_ONESHOT_HEADLESS || 'false' }}
      LITEFUPZL_OUTPUT_DIR: ${{ vars.LITEFUPZL_OUTPUT_DIR || vars.FUCKPZL_ONESHOT_OUTPUT_DIR || secrets.LITEFUPZL_OUTPUT_DIR || secrets.FUCKPZL_ONESHOT_OUTPUT_DIR || 'output/litefupzl' }}
      LITEFUPZL_BROWSER: ${{ github.event_name == 'workflow_dispatch' && inputs.browser_backend != 'configured' && inputs.browser_backend || vars.LITEFUPZL_BROWSER || vars.FUCKPZL_ONESHOT_BROWSER || secrets.LITEFUPZL_BROWSER || secrets.FUCKPZL_ONESHOT_BROWSER || 'camoufox' }}
      LITEFUPZL_PROXY_SERVER: ${{ vars.LITEFUPZL_PROXY_SERVER || vars.FUCKPZL_ONESHOT_PROXY_SERVER || secrets.LITEFUPZL_PROXY_SERVER || secrets.FUCKPZL_ONESHOT_PROXY_SERVER || 'http://127.0.0.1:1080' }}
      LITEFUPZL_VIRTUAL_DISPLAY: ${{ vars.LITEFUPZL_VIRTUAL_DISPLAY || vars.FUCKPZL_ONESHOT_VIRTUAL_DISPLAY || secrets.LITEFUPZL_VIRTUAL_DISPLAY || secrets.FUCKPZL_ONESHOT_VIRTUAL_DISPLAY || 'true' }}
      LITEFUPZL_COOKIE_REFRESH_ENABLED: ${{ github.event_name == 'workflow_dispatch' && inputs.cookie_refresh_enabled || vars.LITEFUPZL_COOKIE_REFRESH_ENABLED || vars.FUCKPZL_ONESHOT_COOKIE_REFRESH_ENABLED || secrets.LITEFUPZL_COOKIE_REFRESH_ENABLED || secrets.FUCKPZL_ONESHOT_COOKIE_REFRESH_ENABLED || 'true' }}
      # Usernames: opted into Variables. App logs alias them and the guard redacts them,
      # but the Variable value itself is plaintext (visible in Settings/API, unmasked in logs).
      LITEFUPZL_MUTUAL_LIKE_USERS_JSON: ${{ vars.LITEFUPZL_MUTUAL_LIKE_USERS_JSON || secrets.LITEFUPZL_MUTUAL_LIKE_USERS_JSON || '' }}
      LITEFUPZL_COOKIE_REFRESH_PROBE_SECRET: LITEFUPZL_COOKIE_REFRESH_PROBE
      LITEFUPZL_WATCHDOG_STARTUP_SECONDS: ${{ vars.LITEFUPZL_WATCHDOG_STARTUP_SECONDS || '300' }}
      LITEFUPZL_WATCHDOG_PRE_LOGIN_SECONDS: ${{ vars.LITEFUPZL_WATCHDOG_PRE_LOGIN_SECONDS || '600' }}
      LITEFUPZL_WATCHDOG_COOKIE_SYNC_SECONDS: ${{ vars.LITEFUPZL_WATCHDOG_COOKIE_SYNC_SECONDS || '120' }}
      LITEFUPZL_WATCHDOG_DRIVER_CLEANUP_SECONDS: ${{ vars.LITEFUPZL_WATCHDOG_DRIVER_CLEANUP_SECONDS || '60' }}
      LITEFUPZL_WATCHDOG_POST_LOGIN_GRACE_SECONDS: ${{ vars.LITEFUPZL_WATCHDOG_POST_LOGIN_GRACE_SECONDS || '600' }}
      LITEFUPZL_WATCHDOG_TERMINATION_GRACE_SECONDS: ${{ vars.LITEFUPZL_WATCHDOG_TERMINATION_GRACE_SECONDS || '10' }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install official Cloudflare WARP
        run: |
          sudo apt-get update
          sudo apt-get install -y curl gpg lsb-release
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update
          sudo apt-get install -y cloudflare-warp

      - name: Connect WARP
        run: |
          sudo pkill warp-svc || true
          sudo nohup warp-svc > warp-svc.log 2>&1 &
          sleep 5
          warp-cli --accept-tos registration new || warp-cli registration new || true
          warp-cli --accept-tos connect || warp-cli connect || true
          sleep 15
          warp-cli --accept-tos status || warp-cli status || true
          curl -fsSL https://www.cloudflare.com/cdn-cgi/trace | sed -E 's/^ip=.*/ip=<redacted>/' | tee warp-trace.txt
          grep -q 'warp=on' warp-trace.txt

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.lock
          python -m pip install --no-build-isolation --no-deps -e .
          sudo apt-get install -y xvfb
          case "${LITEFUPZL_BROWSER:-camoufox}" in
            patchright-chromium)
              python -m patchright install --with-deps chromium
              ;;
            camoufox)
              python -m playwright install-deps firefox
              GITHUB_TOKEN="${{ github.token }}" python apps/litefupzl/fetch_camoufox.py
              ;;
            firefox)
              python -m playwright install --with-deps firefox
              ;;
            *)
              python -m playwright install --with-deps chromium
              ;;
          esac

      - name: Start local HTTP proxy over WARP
        run: |
          nohup python -m proxy --hostname 127.0.0.1 --port 1080 > local-proxy.log 2>&1 &
          sleep 5
          curl -fsSL -x http://127.0.0.1:1080 https://www.cloudflare.com/cdn-cgi/trace | sed -E 's/^ip=.*/ip=<redacted>/' | tee warp-proxy-trace.txt
          grep -q 'warp=on' warp-proxy-trace.txt

      - name: Run oneshot
        id: run_oneshot
        env:
          # Scope production credentials to the process that actually needs them.
          LITEFUPZL_COOKIES_JSON: ${{ secrets.LITEFUPZL_COOKIES_JSON || secrets.FUCKPZL_ONESHOT_COOKIES_JSON }}
          LITEFUPZL_ACTIONS_ADMIN_TOKEN: ${{ secrets.LITEFUPZL_ACTIONS_ADMIN_TOKEN || secrets.FUCKPZL_ACTIONS_ADMIN_TOKEN }}
        run: |
          if [ "${LITEFUPZL_HEADLESS:-true}" = "false" ] && [ "${LITEFUPZL_VIRTUAL_DISPLAY:-true}" != "true" ]; then
            xvfb-run -a python apps/litefupzl/watchdog.py
          else
            python apps/litefupzl/watchdog.py
          fi

      - name: Run cookie refresh persistence probe
        if: always() && github.event_name == 'workflow_dispatch' && inputs.cookie_refresh_probe == 'true'
        env:
          LITEFUPZL_ACTIONS_ADMIN_TOKEN: ${{ secrets.LITEFUPZL_ACTIONS_ADMIN_TOKEN || secrets.FUCKPZL_ACTIONS_ADMIN_TOKEN }}
        run: python apps/litefupzl/cookie_refresh_probe.py

      - name: Upload redacted artifacts
        if: always() && github.event_name == 'workflow_dispatch' && inputs.upload_artifacts == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: litefupzl-oneshot-public-artifacts
          path: |
            ${{ env.LITEFUPZL_OUTPUT_DIR }}/
            warp-trace.txt
            warp-proxy-trace.txt
            warp-svc.log
            local-proxy.log

      - name: Cleanup old workflow runs
        if: always()
        env:
          ACTIONS_CLEANUP_TOKEN: ${{ github.token }}
          ACTIONS_RUNS_KEEP: ${{ vars.LITEFUPZL_ACTIONS_RUNS_KEEP || vars.FUCKPZL_ACTIONS_RUNS_KEEP || secrets.LITEFUPZL_ACTIONS_RUNS_KEEP || secrets.FUCKPZL_ACTIONS_RUNS_KEEP || '15' }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          repo = os.environ.get("GITHUB_REPOSITORY")
          token = os.environ.get("ACTIONS_CLEANUP_TOKEN")
          current_run_id = str(os.environ.get("GITHUB_RUN_ID") or "")
          try:
              keep = max(1, int(os.environ.get("ACTIONS_RUNS_KEEP") or "15"))
          except ValueError:
              keep = 15

          if not repo or not token:
              print("cleanup_skipped=missing_repo_or_token")
              raise SystemExit(0)

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "User-Agent": "litefupzl-actions-run-cleanup",
          }

          def request(method: str, url: str):
              req = urllib.request.Request(url, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=30) as resp:
                  payload = resp.read()
                  return json.loads(payload) if payload else None

          all_runs = []
          page = 1
          while True:
              url = "https://api.github.com/repos/{}/actions/runs?{}".format(
                  repo,
                  urllib.parse.urlencode({"per_page": 100, "page": page}),
              )
              try:
                  data = request("GET", url)
              except urllib.error.HTTPError as exc:
                  print(f"cleanup_fetch_failed=status_{exc.code}")
                  raise SystemExit(0)

              runs = (data or {}).get("workflow_runs", [])
              if not runs:
                  break
              all_runs.extend(runs)
              if len(runs) < 100:
                  break
              page += 1

          deleted = 0
          skipped = 0
          for index, run in enumerate(all_runs):
              if index < keep:
                  continue
              run_id = str(run.get("id") or "")
              if not run_id or run_id == current_run_id or run.get("status") != "completed":
                  skipped += 1
                  continue
              try:
                  request("DELETE", f"https://api.github.com/repos/{repo}/actions/runs/{run_id}")
                  deleted += 1
                  print(f"deleted_run={run_id}")
              except urllib.error.HTTPError as exc:
                  skipped += 1
                  print(f"delete_failed={run_id} status={exc.code}")

          print(f"cleanup_runs_seen={len(all_runs)} keep={keep} deleted={deleted} skipped={skipped}")
          PY
